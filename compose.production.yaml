name: egofocus-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: egofocus
      POSTGRES_USER: egofocus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U egofocus -d egofocus']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    cpus: ${DB_CPU_LIMIT:-0.75}
    pids_limit: 200
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  api:
    build: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PGHOST: db
      PGDATABASE: egofocus
      PGUSER: egofocus
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-8082}:8080'
    networks:
      default:
      gateway:
        aliases:
          - egofocus-api
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${API_MEMORY_LIMIT:-256m}
    cpus: ${API_CPU_LIMIT:-0.5}
    pids_limit: 100
    logging: *logging
networks:
  gateway:
    external: true
    name: ego-gateway-egofocus
volumes:
  pgdata:
