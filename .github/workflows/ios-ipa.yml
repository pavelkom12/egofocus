name: iPhone IPA
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Release: автономно; Debug: Metro / Fast Refresh'
        type: choice
        options: [Release, Debug]
        default: Release
permissions:
  contents: read
concurrency:
  group: iphone-ipa
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: '1'
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_NO_TELEMETRY: '1'
      CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          xcodebuild -version
      - run: npm ci
      - name: Check project
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run deps:check
      - name: Check native history mutations
        run: |
          mkdir -p build
          swiftc modules/ego-live-activity/ios/EgoHistory.swift tests/LiveActivityHistoryTests.swift -o build/check-live-history
          build/check-live-history
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -workspace ios/EgoFocus.xcworkspace -scheme EgoFocus \
            -configuration "$CONFIGURATION" -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log
      - name: Package IPA with all embedded extensions
        shell: bash
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/$CONFIGURATION-iphoneos/EgoFocus.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          if [ "$CONFIGURATION" = Release ]; then
            test -f "$APP/main.jsbundle" || { echo "::error::Release JS bundle is missing"; exit 1; }
          fi
          mkdir -p build/package/Payload
          ditto "$APP" build/package/Payload/EgoFocus.app
          python3 - <<'PY'
          import pathlib
          original = pathlib.Path("build/DerivedData/Build/Products")
          source = next(original.glob("*-iphoneos/EgoFocus.app"))
          target = pathlib.Path("build/package/Payload/EgoFocus.app")
          extensions = sorted(str(p.relative_to(source)) for p in source.rglob("*.appex"))
          assert extensions == sorted(str(p.relative_to(target)) for p in target.rglob("*.appex"))
          assert "PlugIns/EgoLiveActivity.appex" in extensions, "Live Activity extension is missing"
          print("Preserved extensions:", extensions)
          PY
          (cd build/package && /usr/bin/zip -qry "../EgoFocus-$CONFIGURATION-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: EgoFocus-${{ inputs.configuration }}-unsigned
          path: frontend/build/*.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iphone-build-logs
          path: frontend/build/*.log
          if-no-files-found: ignore
          retention-days: 7
