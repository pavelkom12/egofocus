name: egofocus
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: egofocus
      POSTGRES_USER: egofocus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U egofocus -d egofocus']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      PGHOST: db
      PGDATABASE: egofocus
      PGUSER: egofocus
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8081}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-8082}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  pgdata:
